        /* rate change */
        videoEl.addEventListener('ratechange', (e) => {
            observedEvents.push("ratechange");
            const rate = videoEl.playbackRate;
            observedRates.push(rate);
            observedRate = rate;
            const info = "Video Player Rate Change to " + observedRate;
            dispUIMessage(info);
            checkAndLogEvents("ratechange", info)
            updatePosValidationInfo(rate)
            if (parseInt(observedRate) > 0) {
                var rate_index = parseInt(observedRate)
                updatePosValidationInfo(rate_index)
            }
        });

        /* volume change */
        videoEl.addEventListener('volumechange', (e) => {
            observedEvents.push("volumechange");
            observedMute = videoEl.muted;
            const info = "Video Player Volume Change, Mute Status: " + observedMute;
            checkAndLogEvents("volumechange", info)
            updatePosValidationInfo(1);
        });

        /* error */
        videoEl.addEventListener('error', (e) => {
            // AAMP renders on the native plane and does not use this <video> element; ignore its errors.
            if (isAAMP) return;
            errorFlag = 1;
            stopFPSMonitoring();
            const err = videoEl.error;
            let errorMsg = "[ERROR]: ";
            if (!err) errorMsg += "Unknown error";
            else {
                switch (err.code) {
                    case MediaError.MEDIA_ERR_ABORTED: errorMsg += "Media playback aborted by user."; break;
                    case MediaError.MEDIA_ERR_NETWORK: errorMsg += "Network error occurred."; break;
                    case MediaError.MEDIA_ERR_DECODE: errorMsg += "Decoding error - possibly unsupported codec."; break;
                    case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED: errorMsg += "Media source format not supported."; break;
                    default: errorMsg += "Video Player Error"; break;
                }
            }
            dispUIMessage(errorMsg);
            logMsg(errorMsg);
        });

        /* ------------------------
           Validation & event flow helpers
           ------------------------ */
        function checkAndLogEvents(checkevent, msg) {
            if (expectedEvents.includes(checkevent)) {
                // AAMP-only: only show the full "Observed Event" banner once every event in
                // expectedEvents has actually occurred (e.g. both "seeking" and "seeked" for a
                // seek operation). Otherwise an intermediate event (like "seeking") would get its
                // own banner too, producing a separate, duplicate-looking banner before the final
                // one. The non-AAMP (native <video> element) path keeps its original behavior.
                if (!isAAMP || expectedEvents.every(e => observedEvents.includes(e))) {
                    logEventMsg(observedEvents, msg);
                } else {
                    logMsg(msg);
                }
            } else {
                logMsg(msg);
            }
        }
        function setExpPlayBackEvents() {
            // AAMP: also require "play" to have been observed, matching the expected/observed
            // event format used for fail-fast diagnosis (e.g. "Expected Event: play,ended" /
            // "Observed Event: play" when AAMP never signals completion). Non-AAMP keeps its
            // original ["ended"]-only behavior.
            expectedEvents = isAAMP ? ["play", "ended"] : ["ended"];
            if (isAAMP) {
                aampPlaytillendDeadline = Date.now() + AAMP_PLAYTILLEND_FAIL_BUDGET_MS;
                aampPlaytillendPending = true;
            }
            logMsg("Expected Event: " + expectedEvents);
            logMsg("Observed Event: " + observedEvents);
        }

        /* Loop validation helper */
        function validateLoop(expected) {
            if (videoEl.loop === expected) {
                logMsg("Video loop operation success\n");
            } else {
                eventFlowFlag = 0;
                logMsg("Video loop operation failure\n");
            }
        }

        /* checks expected vs observed and additional checks per event type */
        async function updateEventFlowFlag() {
            let Status = "SUCCESS";
            try {
                if (expectedEvents.includes("play") && isAAMP && !observedEvents.includes("play") && (Date.now() - aampPlayRequestTs) < AAMP_PLAY_EVENT_GRACE_MS) {
                    setTimeout(() => { updateEventFlowFlag(); }, 1000);
                    return;
                }
                if (expectedEvents.includes("ended") && isAAMP && !observedEvents.includes("ended")) {
                    // AAMP-only fail-fast: actively poll the live session state in case the
                    // terminal onEOS/onStateChanged("complete") notification was never delivered
                    // over the websocket, logging progress each time to keep the external test
                    // harness's activity watchdog satisfied. Give up after a bounded budget.
                    try { await window.aampPlayer.getStateFromSession(); } catch (e) { }
                    const polledState = window.aampPlayer.stateNum;
                    if (polledState === AAMP_STATES.Complete || polledState === AAMP_STATES.Stopped) {
                        observedEvents.push("ended");
                        dispUIMessage("[Event]: Video Player Ended");
                        logMsg("Video PlayBack Completed !!!");
                    } else if (Date.now() < aampPlaytillendDeadline) {
                        try { await window.aampPlayer.getPlaybackPositionFromSession(); } catch (e) { }
                        const currPos = Number(window.aampPlayer.getCurrentPosition() || 0);
                        logMsg("Video Progressing " + currPos.toFixed(2) + "/" + Number(vidDuration).toFixed(2));
                        setTimeout(() => { updateEventFlowFlag(); }, 3000);
                        return;
                    }
                }
                if (isAAMP) aampPlaytillendPending = false;
                if (!expectedEvents.every(e => observedEvents.indexOf(e) >= 0)) {
                    eventFlowFlag = 0;
                    Status = "FAILURE";
                    if (isAAMP && expectedEvents.includes("play")) aampPlayValidationPending = false;
                    logMsg("Failure Reason: Expected events not occurred");
                } else {
                if (expectedEvents.includes("pause")) {
                    const paused = isAAMP ? (window.aampPlayer.getCurrentState() === AAMP_STATES.Paused) : videoEl.paused;
                    if (!paused) {
                        eventFlowFlag = 0;
                        Status = "FAILURE";
                        logMsg("Video pause operation failure\n");
                    } else logMsg("Video pause operation success\n");
                } else if (expectedEvents.includes("play") && !expectedEvents.includes("ended")) {
                    // AAMP playtillend expects both "play" and "ended"; by the time "ended" is
                    // satisfied the player state is Complete (not Playing), so this standalone
                    // play-validation branch must be skipped in that combined case - it's only for
                    // the pure "play" action, where expectedEvents never also includes "ended".
                    const playing = isAAMP ? (window.aampPlayer.getCurrentState() === AAMP_STATES.Playing) : !videoEl.paused;
                    if (isAAMP && playing) {
                        // Push (onProgress) telemetry can be throttled/batched and still report the
                        // pre-resume position well after the player has actually started advancing.
                        // Actively poll the live RPC position here to avoid declaring a false stall.
                        try { await window.aampPlayer.getPlaybackPositionFromSession(); } catch (e) { }
                        const currPos = Number(window.aampPlayer.getCurrentPosition() || 0);
                        // onProgress can stop firing entirely while truly stalled; keep the standard
                        // "Video Progressing" log line alive from this active poll too, so the log
                        // doesn't go silent during a stuck resume.
                        const polledDur = Number(window.aampPlayer.lastDuration || vidDuration || 0);
                        if (polledDur > 0) logMsg("Video Progressing " + currPos.toFixed(2) + "/" + polledDur.toFixed(2));
                        if (currPos <= (aampPlayStartPos + 0.2)) {
                            const sincePlayRequest = Date.now() - aampPlayRequestTs;
                            const sinceObservedPlay = aampPlayObservedTs ? (Date.now() - aampPlayObservedTs) : 0;
                            if (sinceObservedPlay < AAMP_PLAY_MOVEMENT_GRACE_MS) {
                                setTimeout(() => { updateEventFlowFlag(); }, 1000);
                                return;
                            }
                            // Recovery (including the seek-based last resort) is owned entirely by
                            // window.aampPlayer.resume()'s own fallback chain (triggered from play()).
                            // Just keep waiting here for that chain to take effect; don't run a second,
                            // independent recovery action concurrently with it.
                            if (sincePlayRequest < AAMP_PLAY_TOTAL_SETTLE_MS) {
                                setTimeout(() => { updateEventFlowFlag(); }, 1000);
                                return;
                            }
                            eventFlowFlag = 0;
                            Status = "FAILURE";
                            aampPlayValidationPending = false;
                            logMsg("Test step status: " + Status);
                            return;
                        }
                    }
                    if (!playing) {
                        eventFlowFlag = 0;
                        Status = "FAILURE";
                        if (isAAMP) aampPlayValidationPending = false;
                        logMsg("Video play operation failure\n");
                    } else {
                        if (isAAMP) aampPlayValidationPending = false;
                        logMsg("Video play operation success\n");
                    }
                } else if (expectedEvents.includes("ended")) {
                    const endedReached = isAAMP ? observedEvents.includes("ended") : videoEl.ended;
                    if (!endedReached) {
                        eventFlowFlag = 0;
                        Status = "FAILURE";
                        logMsg("Video playtillend operation failure\n");
                    } else {
                        logMsg("Video playtillend operation success\n");
                    }
                } else if (expectedEvents.includes("volumechange")) {
                    if (isAAMP) {
                        if (expectedMute !== "") {
                            const currMute = window.aampPlayer.getMute();
                            if (currMute === expectedMute) {
                                logMsg(expectedMute ? "Video mute operation success\n" : "Video unmute operation success\n");
                            } else {
                                eventFlowFlag = 0;
                                Status = "FAILURE";
                                logMsg(expectedMute ? "Video mute operation failure\n" : "Video unmute operation failure\n");
                            }
                            expectedMute = "";
                        }
                        if (expectedVolume !== "") {
                            const currVol = parseInt(window.aampPlayer.getVolume());
                            if (currVol === parseInt(expectedVolume)) {
                                logMsg("Video volume operation success\n");
                            } else {
                                eventFlowFlag = 0;
                                Status = "FAILURE";
                                logMsg("Video volume operation failure\n");
                            }
                            expectedVolume = "";
                        }
                        volumeChangeFlag = 0;
                    } else {
                    if (expectedVolume !== "") {
                        if (Math.abs(videoEl.volume - expectedVolume) < 0.05) {
                            logMsg("Set volume operation success\n");
                        } else {
                            eventFlowFlag = 0;
                            logMsg("Set volume operation failure\n");
                        }
                        expectedVolume = "";
                    }
                    if (expectedMute !== "") {
                        const currMute = observedMute;
                        if (expectedMute === true) {
                            if (currMute) {
                                logMsg("Video mute operation success\n");
                            } else {
                                eventFlowFlag = 0;
                                logMsg("Video mute operation failure\n");
                            }
                        } else if (expectedMute === false) {
                            if (!currMute) {
                                logMsg("Video unmute operation success\n");
                            } else {
                                eventFlowFlag = 0;
                                logMsg("Video unmute operation failure\n");
                            }
                        }
                    }
                    }
                }
                else if (expectedEvents.includes("seeking")) {
                    var currTime = parseInt(observedPos);
                    var expTime = parseInt(expectedPos);
                    if (currTime >= (expTime - SEEK_TOLERANCE.lower) && currTime <= (expTime + SEEK_TOLERANCE.upper)) {
                        logMsg("Video seek operation success\n");
                    } else {
                        eventFlowFlag = 0;
                        Status = "FAILURE";
                        logMsg("Video seek operation failure\n");
                        logMsg("Failure Reason: Seeked pos is not within expected range");
                    }
                }
                else if (expectedEvents.includes("ratechange")) {
                    const allRatesMatched = expectedRates.every(e => observedRates.includes(e));
                    const expectedRateMatched = observedRates.includes(expectedRate);

                    if (allRatesMatched && expectedRateMatched) {
                        logMsg("Video rate change operation success\n");
                    } else {
                        eventFlowFlag = 0;
                        Status = "FAILURE";
                        logMsg("Video rate change operation failure\n");
                        logMsg("Failure Reason: Playback rate is not as expected");
                    }
                } else if (audioChangeFlag === 1) {
                    audioChangeFlag = 0;
                    const currAudioIndex = parseInt(await window.aampPlayer.getAudioTrack());
                    if (currAudioIndex === parseInt(expectedAudioIndex)) {
                        logMsg("Audio language change operation success\n");
                    } else {
                        eventFlowFlag = 0;
                        Status = "FAILURE";
                        logMsg("Audio language change operation failure\n");
                        logMsg("Failure Reason: Current Audio track index is not as expected");
                    }
                } else if (textChangeFlag === 1) {
                    textChangeFlag = 0;
                    const currTextIndex = parseInt(await window.aampPlayer.getTextTrack());
                    if (currTextIndex === parseInt(expectedTextIndex)) {
                        logMsg("Text Track change operation success\n");
                    } else {
                        eventFlowFlag = 0;
                        Status = "FAILURE";
                        logMsg("Text Track change operation failure\n");
                        logMsg("Failure Reason: Current Text track index is not as expected");
                    }
                } else if (audioTracksAvailability === 0 || textTracksAvailability === 0) {
                    Status = "FAILURE";
                    logMsg("Failure Reason: Audio/Text tracks list empty");
                } else if (VideoBitrateChangeFlag === 1) {
                    VideoBitrateChangeFlag = 0;
                    const currVideoBitrate = Number(await window.aampPlayer.getCurrentVideoBitrate());
                    if (currVideoBitrate === Number(expectedVideoBitrate)) {
                        logMsg("Video bitrate change operation success\n");
                    } else {
                        eventFlowFlag = 0;
                        Status = "FAILURE";
                        logMsg("Video bitrate change operation failure\n");
                        logMsg("Failure Reason: Current Video bitrate is not as expected");
                    }
                } else if (videoBitratesAvailability === 0) {
                    Status = "FAILURE";
                    logMsg("Failure Reason: Unable to select new video bitrate");
                } else if (SetVideoTrackFlag === 1) {
                    const tracks = normalizeTrackList(await window.aampPlayer.getAvailableVideoTracks());
                    let expectedSet = false;
                    for (const t of tracks) {
                        if (Number(t.bandwidth) === Number(expectedVideoTrack)) {
                            if (Number(t.enabled) === 1) expectedSet = true;
                        } else if (Number(t.enabled) === 1) {
                            expectedSet = false;
                        }
                    }
                    if (expectedSet) {
                        logMsg("Expected Video Track is set");
                    } else {
                        eventFlowFlag = 0;
                        Status = "FAILURE";
                        logMsg("Expected Video Track is not set");
                    }
                } else if (SetThumbnailTrackFlag === 1) {
                    eventFlowFlag = 0;
                    Status = "FAILURE";
                    logMsg("Failure Reason: Unable to set Thumbnail");
                } else if (SetAudioInfoFlag === 1) {
                    eventFlowFlag = 0;
                    Status = "FAILURE";
                    logMsg("Failure Reason: Audio Track Info is Empty");
                } else if (SetTextInfoFlag === 1) {
                    eventFlowFlag = 0;
                    Status = "FAILURE";
                    logMsg("Failure Reason: Text Track Info is Empty");
                } else if (SetPlaybackFlag === 1) {
                    eventFlowFlag = 0;
                    Status = "FAILURE";
                    logMsg("Failure Reason: Playback Info is Empty");
                } else if (SetPrefAudio === 1) {
                    const currPrefAudio = await window.aampPlayer.getPreferredAudioProperties();
                    logMsg("Current Prefered Audio " + JSON.stringify(currPrefAudio));
                    const prefStr = typeof currPrefAudio === "string" ? currPrefAudio : JSON.stringify(currPrefAudio);
                    if (expectedPrefAudio && prefStr.includes(expectedPrefAudio)) {
                        logMsg("Preferred Audio is set successfully");
                    } else {
                        logMsg("Preferred Audio is not set successfully");
                        eventFlowFlag = 0;
                        Status = "FAILURE";
                    }
                }
                }
            } catch (e) {
                eventFlowFlag = 0;
                Status = "FAILURE";
                logMsg("Failure Reason: Operation validation threw exception: " + e);
            }
            logMsg("Test step status: " + Status);
        }

        /* ------------------------
           Pos validation accumulation (pos_list / pos_val_result)
           ------------------------ */
        function updatePosValidationInfo(index) {
            if (!pos_val_flag) {
                pos_val_flag = 1;
                pos_val_index = index;
                logMsg("Video pos index set as " + pos_val_index + ", capturing video progress positions ...");
            }
        }
        function updatePrevPosValidationResult() {
            pos_val_flag = 0;
            const result = getPosValResult(pos_list, pos_val_index);
            pos_val_result.push(result);
            pos_list = [];
        }

        function dispProgressLog() {
            const currentTime = videoEl.currentTime;
            const duration = getDuration();
            progressEventMsg = "Video Progressing " + currentTime.toFixed(2) + "/" + duration.toFixed(2);
            logMsg(progressEventMsg);
            message2 = "Pos: " + currentTime.toFixed(2) + "/" + duration.toFixed(2);
            dispUIVideoPosition(message2);
            if (check_end_duration === 1 && parseInt(currentTime) >= (parseInt(closeDuration) - 3)) {
                pos_end_flag = 1;
            }
            if (pos_val_flag === 1) {
                pos_list.push(currentTime.toFixed(2));
            }
        }

        function getPosValResult(pos_list, pos_index, live_test_flag = 0) {
            var pos_val_status = "SUCCESS";
            var critical_mismatch_flag = false;
            var vid_pos_list = [];
            var pos_diff = 0;
            var mismatch = "";
            var pos_mismatch_count = 0;
            var pos_mismatch_list = [];

            if (pos_list.length > 1) {
                if (pos_index != 0) {
                    // removing video progress pos duplicates
                    // for video operations except pause
                    pos_list.forEach((pos) => {
                        if (!vid_pos_list.includes(parseInt(pos)))
                            vid_pos_list.push(parseInt(pos));
                    });
                } else {
                    // keeping video progress pos duplicates as such
                    // for video pause operation
                    pos_list.forEach((pos) => {
                        vid_pos_list.push(parseInt(pos));
                    });
                }

                if (vid_pos_list.length > 1) {
                    if (!validationState.initialPosCheckDone && live_test_flag == 0) {
                        if (vid_pos_list[0] > 3) {
                            mismatch = "Pos:" + "0" + "-" + vid_pos_list[0] + ",diff=" + vid_pos_list[0];
                            pos_mismatch_list.push(mismatch);
                            critical_mismatch_flag = true;
                        }
                        validationState.initialPosCheckDone = true;
                    }

                    for (var i = 0; i < vid_pos_list.length - 1; i++) {
                        // finding the diff of curr pos and prev pos values
                        pos_diff = vid_pos_list[i + 1] - vid_pos_list[i];

                        if (pos_index > 0) {
                            // for forward trick-play / normal playback (position increasing)
                            if (pos_diff < 0 || pos_diff >= (pos_index + 3)) {
                                critical_mismatch_flag = true;
                                pos_mismatch_count += 1;
                                mismatch = "Pos:" + vid_pos_list[i + 1] + "-" + vid_pos_list[i] + ",diff=" + pos_diff;
                                pos_mismatch_list.push(mismatch);
                            }
                            // check whether pos diff is >= to the required diff
                            if (!(pos_diff == pos_index)) {
                                pos_mismatch_count += 1;
                                mismatch = "Pos:" + vid_pos_list[i + 1] + "-" + vid_pos_list[i] + ",diff=" + pos_diff;
                                pos_mismatch_list.push(mismatch);
                            }
                        } else if (pos_index < 0) {
                            // for rewind trick-play (position expected to decrease, mirrors the
                            // forward-rate checks above but in the opposite direction)
                            if (pos_diff > 0 || pos_diff <= (pos_index - 3)) {
                                critical_mismatch_flag = true;
                                pos_mismatch_count += 1;
                                mismatch = "Pos:" + vid_pos_list[i + 1] + "-" + vid_pos_list[i] + ",diff=" + pos_diff;
                                pos_mismatch_list.push(mismatch);
                            }
                            if (!(pos_diff == pos_index)) {
                                pos_mismatch_count += 1;
                                mismatch = "Pos:" + vid_pos_list[i + 1] + "-" + vid_pos_list[i] + ",diff=" + pos_diff;
                                pos_mismatch_list.push(mismatch);
                            }
                        } else {
                            // for video pause operation
                            if (!(pos_diff == pos_index)) {
                                pos_mismatch_count += 1;
                                mismatch = "Pos:" + vid_pos_list[i + 1] + "-" + vid_pos_list[i] + ",diff=" + pos_diff;
                                pos_mismatch_list.push(mismatch);
                            }
                        }
                    }

                    // If the pos diff is not as expected for more than max threshold limit
                    // consider pos validation status as failure
                    if (pos_mismatch_count > 3 || critical_mismatch_flag == true) {
                        logMsg(pos_mismatch_list);
                        logMsg("Failure Reason: Video Progress position difference is not as expected");
                        pos_val_status = "FAILURE";
                    }
                } else {
                    pos_val_status = "FAILURE";
                }
            } else {
                pos_val_status = "FAILURE";
            }

            logMsg("Video progress position validation status: " + pos_val_status);
            return pos_val_status;
        }

        /* ------------------------
           Auto test runner (operations from URL)
           ------------------------ */

        function getVideoOperations(operationsStr) {
            var operations = operationsStr.split(',');
            var repeatpos = []
            var alloperations = ""
            for (var i = 0; i < operations.length; i++) {
                if (operations[i].includes("repeat"))
                    repeatpos.push(i)
            }
            if (repeatpos.length > 0) {
                var i, j, t, temp
                for (var n = 0; n < repeatpos.length; n++) {
                    if (n == 0)
                        i = 0
                    else
                        i = parseInt(repeatpos[n - 1]) + 1
                    j = parseInt(repeatpos[n])
                    t = parseInt(operations[repeatpos[n]].split("(")[1].split(")")[0]);
                    temp = ""
                    for (var k = 0; k < t; k++) {
                        if (temp != "")
                            temp += ","
                        temp = temp + operations.slice(i, j)
                    }
                    if (alloperations != "")
                        alloperations += ","
                    alloperations += temp
                }
                temp = ""
                i = parseInt(repeatpos[repeatpos.length - 1])
                j = parseInt(operations.length - 1)
                if (i != j) {
                    if (i + 1 != j)
                        temp = temp + operations.slice(i + 1, j + 1)
                    else
                        temp = temp + operations[j]
                    alloperations = alloperations + "," + temp
                }
                operations = alloperations.split(",")
            }
            return operations
        }

        function clearEvents() {
            observedEvents = [];
            expectedEvents = [];
            updatePrevPosValidationResult();
        }

        function parseOperation(op) {
            const match = op.match(/(\w+)\(([^)]*)\)/);
            return match ? { action: match[1], params: match[2].split(':') } : { action: op, params: [] };
        }

        function performOperations(operations) {
            let actionInterval = 0
            let duration = 0, position = 0
            logMsg("Setting up the operations...")
            check_end_duration = 0;
            pos_end_flag = 0;
            testStatus = 0;
            closeDuration = 0;
            playerClosed = false;
            audioChangeFlag = 0;
            textChangeFlag = 0;
            audioTracksAvailability = 1;
            textTracksAvailability = 1;
            VideoBitrateChangeFlag = 0;
            videoBitratesAvailability = 1;
            SetVideoTrackFlag = 0;
            SetThumbnailTrackFlag = 0;
            SetAudioInfoFlag = 0;
            SetTextInfoFlag = 0;
            SetPlaybackFlag = 0;
            SetPrefAudio = 0;
            const actionList = operations.map(op => op.split('(')[0]);
            if (actionList.every(op => op === "close")) {
                check_end_duration = 1;
            }
            for (var i = 0; i < operations.length; i++) {
                var action = operations[i].split('(')[0];
                const op = operations[i];
                const param = op.includes('(') ? op.split('(')[1].split(')')[0] : '';
                if (action == "seekpos") {
                    duration = parseInt(operations[i].split('(')[1].split(')')[0].split(":")[0]);
                    position = parseInt(operations[i].split('(')[1].split(')')[0].split(":")[1]);
                }
                else {
                    duration = parseInt(operations[i].split('(')[1].split(')')[0]);
                }
                if (action == "close") {
                    closeDuration = duration;
                }
                if (action == "playtillend")
                    // AAMP: check much sooner after the expected duration elapses instead of the
                    // flat 60s buffer, so the fail-fast retry/poll logic in updateEventFlowFlag()
                    // has time to run (and log activity) well before an external test harness's
                    // own "no activity for 1 min" watchdog would trip. Non-AAMP keeps the
                    // original 60000ms buffer unchanged.
                    actionInterval = actionInterval + (interval * parseInt(vidDuration)) + (isAAMP ? 2000 : 60000);
                else
                    actionInterval = actionInterval + (interval * duration)
                //logMsg("setting " + action + " at " + actionInterval + " th sec")
                if (action == "pause") {
                    setTimeout(() => {
                        clearEvents()
                        pause()
                    }, actionInterval);
                }
                else if (action == "play") {
                    setTimeout(() => {
                        clearEvents()
                        play()
                    }, actionInterval);
                }
                else if (action == "playtillend") {
                    setTimeout(() => {
                        setExpPlayBackEvents()
                    }, actionInterval);
                }
                else if (action == "playnow") {
                    setTimeout(() => {
                        clearEvents()
                        playNow()
                    }, actionInterval);
                }
                else if (action == "close") {
                    setTimeout(() => {
                        const doClose = () => {
                            // AAMP-only: if a preceding playtillend's fail-fast retry/poll loop
                            // is still active, let it finish and log its own success/failure
                            // first, so this explicit close doesn't cut it off mid-retry.
                            if (isAAMP && aampPlaytillendPending) {
                                setTimeout(doClose, 1000);
                                return;
                            }
                            updatePrevPosValidationResult()
                            logMsg("**************** Going to close ****************")
                            clearInterval(progressLogger);
                            stopFPSMonitoring();
                            closePlayer()
                            playerClosed = true;
                        };
                        doClose();
                    }, actionInterval);
                }
                else if (action == "seekfwd") {
                    setTimeout(() => {
                        clearEvents()
                        seekfwd(seekInterval)
                    }, actionInterval);
                }
                else if (action == "seekbwd") {
                    setTimeout(() => {
                        clearEvents()
                        seekbwd(seekInterval)
                    }, actionInterval);
                }
                else if (action == "changeurl") {
                    setTimeout(() => {
                        clearEvents()
                        reload()
                    }, actionInterval);
                }
                else if (action == "changeaudio") {
                    setTimeout(() => {
                        clearEvents()
                        changeAudio()
                    }, actionInterval);
                }
                else if (action == "changetext") {
                    setTimeout(() => {
                        clearEvents()
                        changeText()
                    }, actionInterval);
                }
                else if (action == "seekpos") {
                    // Capture this iteration's position in a fresh block-scoped const -- `position`
                    // itself is declared once outside the loop and gets overwritten by later
                    // seekpos(...) operations before this deferred callback ever runs, which would
                    // otherwise make every seekpos() in the operations list seek to the same
                    // (last-parsed) position.
                    const seekPosition = position;
                    setTimeout(() => {
                        clearEvents()
                        seekpos(seekPosition)
                    }, actionInterval);
                }
                else if (action == "fastfwd2x" || action == "fastfwd3x" || action == "fastfwd4x"
                    || action == "fastfwd16x" || action == "fastfwd32x"
                    || action == "rewind4x" || action == "rewind16x" || action == "rewind32x") {
                    const rateMap = {
                        fastfwd2x: 2, fastfwd3x: 3, fastfwd4x: 4, fastfwd16x: 16, fastfwd32x: 32,
                        rewind4x: -4, rewind16x: -16, rewind32x: -32
                    };
                    const rate = rateMap[action];
                    setTimeout(() => {
                        clearEvents()
                        setPlaybackRate(rate)
                    }, actionInterval);
                }
                else if (action == "checkmute") {
                    setTimeout(() => {
                        clearEvents()
                        checkmute()
                    }, actionInterval);
                }
                else if (action == "changevideobitrate") {
                    setTimeout(() => {
                        clearEvents()
                        changeVideoBitrate()
                    }, actionInterval);
                }
                else if (action == "curraudiobitrate") {
                    setTimeout(() => {
                        clearEvents()
                        currentAudioBitrate()
                    }, actionInterval);
                }
                else if (action == "setvideotrack") {
                    setTimeout(() => {
                        clearEvents()
                        setVideoTrack()
                    }, actionInterval);
                }
                else if (action == "setthumbnail") {
                    setTimeout(() => {
                        clearEvents()
                        setThumbnail()
                    }, actionInterval);
                }
                else if (action == "audiotrackinfo") {
                    setTimeout(() => {
                        clearEvents()
                        AudioTrackInfo()
                    }, actionInterval);
                }
                else if (action == "texttrackinfo") {
                    setTimeout(() => {
                        clearEvents()
                        TextTrackInfo()
                    }, actionInterval);
                }
                else if (action == "statistics") {
                    setTimeout(() => {
                        clearEvents()
                        PlaybackStatistics()
                    }, actionInterval);
                }
                else if (action == "manifest") {
                    setTimeout(() => {
                        clearEvents()
                        Manifest()
                    }, actionInterval);
                }
                else if (action == "prefaudio") {
                    setTimeout(() => {
                        clearEvents()
                        GetPrefAudio()
                    }, actionInterval);
                }
                else if (action == "mute") {
                    setTimeout(() => {
                        clearEvents()
                        mute()
                    }, actionInterval);
                }
                else if (action == "unmute") {
                    setTimeout(() => {
                        clearEvents()
                        unmute()
                    }, actionInterval);
                }
                else if (action == "setvolume") {
                    setTimeout(() => {
                        clearEvents()
                        setVolume(parseFloat(param));
                    }, 10000);
                }
                if (action != "close") {
                    setTimeout(() => {
                        updateEventFlowFlag()
                    }, actionInterval + checkInterval);
                }
            }
            if (!operations.find(o => o.includes("close"))) {
                const tryAutoClose = () => {
                    // AAMP-only: also wait for a still-running playtillend fail-fast retry/poll
                    // loop (aampPlaytillendPending), not just the play-validation flag, so this
                    // auto-close path doesn't cut it off before it logs its final result either.
                    if (isAAMP && (aampPlayValidationPending || aampPlaytillendPending)) {
                        setTimeout(tryAutoClose, 1000);
                        return;
                    }
                    updatePrevPosValidationResult()
                    logMsg("**************** Going to close ****************")
                    clearInterval(progressLogger);
                    stopFPSMonitoring();
                    closePlayer()
                    playerClosed = true;
                };
                setTimeout(tryAutoClose, (actionInterval + 10000));
            }
            const tryDispResult = () => {
                if (!playerClosed) {
                    // Wait for the player to have actually been closed (either via the explicit
                    // "close" action or the auto-close fallback above) before logging the
                    // terminal "TEST RESULT" line - the external test harness watches for that
                    // line and stops as soon as it sees it, so it must never race ahead of
                    // "Going to close" / closePlayer().
                    setTimeout(tryDispResult, 500);
                    return;
                }
                dispTestResult()
            };
            setTimeout(tryDispResult, (actionInterval + 15000));
            // console.log("\n");
        }

        function checkAndStartAutoTesting() {
            if (autotest == "true") {
                const operationsStr = GetURLParameter("operations");
                if (!operationsStr) { logMsg("No auto operations provided"); return; }
                const operations = getVideoOperations(operationsStr);
                logMsg("********************** STARTING AUTO TEST ***********************");
                performOperations(operations);
            } else {
                logMsg("***************** PRESS KEYS TO DO OPERATIONS ********************")
            }
        }

        /* ------------------------
           Test result and reporting
           ------------------------ */

        function dispTestResult() {
            clearInterval(progressLogger);
            stopFPSMonitoring();
            const _storedForLabel = sessionStorage.getItem('successiveURLs');
            const _streamNum = _storedForLabel ? parseInt(sessionStorage.getItem('successiveIndex') || '0') + 1 : null;
            const _streamPrefix = _streamNum ? "STREAM " + _streamNum + " " : "";
            // Use "PLAYBACK RESULT" for per-stream labels to avoid triggering Python's "TEST RESULT" stop condition prematurely
            const _resultLabel = _streamNum ? "STREAM " + _streamNum + " PLAYBACK RESULT" : "TEST RESULT";
            let fpsCheckStatus = "SUCCESS";
            let droppedFramesStatus = "SUCCESS";
            // FPS/dropped-frame validation applies to the HTML5 <video> element only, not native AAMP.
            if (!isAAMP) {
                if (fpsList.length > 0) {
                    const roundedFPS = Math.round(fpsList.reduce((a, b) => a + b, 0) / fpsList.length);
                    // If expectedfps(...) is passed in URL options, treat it as the final minimum FPS.
                    const minFPS = expectedFPSProvided ? expectedFPS : (expectedFPS - FPS_THRESHOLD);
                    const fpsComparison = roundedFPS >= minFPS ? ">=" : "<";
                    logMsg(_streamPrefix + "AVERAGE FPS OBTAINED : " + roundedFPS + " " + fpsComparison + " " + minFPS);
                    if (roundedFPS < minFPS) {
                        fpsCheckStatus = "FAILURE";
                    }
                } else {
                    fpsCheckStatus = "FAILURE";
                    logMsg("Failure Reason: No FPS data collected");
                }
                droppedFramesStatus = droppedFramesTotal <= DROPPED_FRAMES_THRESHOLD ? "SUCCESS" : "FAILURE";
                logMsg(_streamPrefix + "TOTAL DROPPED FRAMES : " + droppedFramesTotal);
                if (droppedFramesStatus === "FAILURE") {
                    fpsCheckStatus = "FAILURE";
                    logMsg("Failure Reason: Dropped frames count (" + droppedFramesTotal + ") exceeded the threshold of " + DROPPED_FRAMES_THRESHOLD);
                }
                logMsg(_streamPrefix + "OVERALL FPS VALIDATION STATUS : " + fpsCheckStatus);
                logMsg(_streamPrefix + "OVERALL DROPPED FRAMES VALIDATION STATUS : " + droppedFramesStatus);
            }
            logMsg(_streamPrefix + "OVERALL VIDEO PLAYBACK ERROR EVENT STATUS : " + (errorFlag ? "FAILURE" : "SUCCESS"));
            logMsg(_streamPrefix + "OVERALL VIDEO PROGRESS POSITION VALIDATION STATUS : " + (pos_val_result.includes("FAILURE") ? "FAILURE" : "SUCCESS"));
            logMsg(_streamPrefix + "OVERALL VIDEO OPERATIONS EVENTS VALIDATION STATUS : " + (eventFlowFlag ? "SUCCESS" : "FAILURE"));
            if (check_end_duration === 1) {
                if (pos_end_flag !== 1) {
                    if (delaytest == "true") {
                        logMsg(_streamPrefix + "VIDEO PLAYED TILL THE END OF THE MENTIONED DURATION : SUCCESS");
                        logMsg(_streamPrefix + "EXPECTED BEHAVIOR IN DELAY TEST");
                    } else {
                        testStatus = 1;
                        logMsg(_streamPrefix + "FAILURE REASON: VIDEO DID NOT PLAYED TILL THE END OF THE MENTIONED DURATION");
                    }
                } else {
                    logMsg(_streamPrefix + "SUCCESS: VIDEO PLAYED TILL THE END OF THE MENTIONED DURATION");
                }
            }
            if (eventFlowFlag === 1 && errorFlag === 0 && !pos_val_result.includes("FAILURE") && fpsCheckStatus === "SUCCESS" && testStatus === 0) {
                logMsg(_resultLabel + " : SUCCESS");
            } else {
                logMsg(_resultLabel + " : FAILURE");
            }

        // Successive playback: record per-URL result, then navigate to next URL or report combined result
        const storedURLs = sessionStorage.getItem('successiveURLs');
        if (storedURLs) {
            const urls = JSON.parse(storedURLs);
            const index = parseInt(sessionStorage.getItem('successiveIndex') || '0');
            const results = JSON.parse(sessionStorage.getItem('successiveResults') || '[]');

            const stepResult = (eventFlowFlag === 1 && errorFlag === 0 && !pos_val_result.includes("FAILURE") && fpsCheckStatus === "SUCCESS" && testStatus === 0) ? "SUCCESS" : "FAILURE";
            const reasons = [];
            if (fpsCheckStatus === "FAILURE") reasons.push("FPS check failed");
            if (droppedFramesStatus === "FAILURE") reasons.push("Dropped frames exceeded threshold");
            if (errorFlag) reasons.push("Video error event occurred");
            if (pos_val_result.includes("FAILURE")) reasons.push("Video progress position validation failed");
            if (!eventFlowFlag) reasons.push("Video operations event flow failed");
            if (testStatus !== 0) reasons.push("Video did not play till the end of the mentioned duration");

            results.push({ index, url: urls[index], status: stepResult, reasons });
            sessionStorage.setItem('successiveResults', JSON.stringify(results));

            const nextIndex = index + 1;
            if (nextIndex < urls.length) {
                sessionStorage.setItem('successiveIndex', String(nextIndex));
                // flush any buffered logs before navigating so they are not lost
                if (message.length > 0) { sendLog(message); message = ""; }
                setTimeout(() => window.location.replace(urls[nextIndex]), 1000);
            } else {
                // All URLs processed — log combined result
                logMsg("**************** SUCCESSIVE PLAYBACK RESULT ****************");
                let combinedStatus = "SUCCESS";
                results.forEach((r) => {
                    let displayUrl = r.url;
                    try {
                        const streamParam = new URL(r.url).searchParams.get('url');
                        if (streamParam) displayUrl = decodeURIComponent(streamParam).replace(/:and:/g, '&').replace(/:eq:/g, '=');
                    } catch(_) {}
                    const label = "STREAM " + (r.index + 1) + " [" + displayUrl + "]";
                    if (r.status !== "SUCCESS") {
                        combinedStatus = "FAILURE";
                        logMsg(label + " : FAILURE - " + (r.reasons.length ? r.reasons.join(", ") : "Unknown reason"));
                    } else {
                        logMsg(label + " : SUCCESS");
                    }
                });
                logMsg("FINAL TEST RESULT: " + combinedStatus);
                sessionStorage.removeItem('successiveURLs');
                sessionStorage.removeItem('successiveIndex');
                sessionStorage.removeItem('successiveResults');
                sessionStorage.removeItem('loadURL');
            }
        }
        }

        // Method to store the app logs and send them to TM
        function captureAppLogs(msg) {
            if (message.length < 300) {
                message = message + "\n" + msg;
            } else {
                sendLog(message);
                message = "" + msg;
            }
        }

        // Method to push the app logs
        function pushAppLogs(msg) {
            // combine with any buffered logs so everything lands in one HTTP call
            message = message.length > 0 ? message + "\n" + msg : msg;
            sendLog(message);
            message = "";
        }

        // Method to send logs to TM via REST API
        function sendLog(msg) {
            const tmURL = GetURLParameter('tmUrl');
            const restURL = tmURL + 'execution/createFileAndWrite?';
            const execID = GetURLParameter('execID');
            const devID = GetURLParameter('execDevId');
            const resID = GetURLParameter('resultId');

            fetch(restURL + new URLSearchParams({
                execId: execID,
                execDevId: devID,
                resultId: resID,
                test: msg
            }))
                .then(response => {
                    console.log('Response from Test Manager: ' + JSON.stringify(response));
                })
                .catch(error => {
                    console.log('Error while connecting to Test Manager: ' + error);
                });
        }

        /* ------------------------
           Init - load url from query and attach UI
           ------------------------ */
        window.addEventListener('load', () => {
            load(true);
            window.HTMLPlayer = {
                load, play, pause, seek, seekfwd, seekbwd, setPlaybackRate, getRate, setVolume, getVolume, mute, unmute,
                getPosition, getDuration, dispTestResult, updatePrevPosValidationResult,
                startFPSMonitoring, stopFPSMonitoring
            };

            logMsg("HTML player ready. API object: window.HTMLPlayer");
        });
    </script>
</body>
