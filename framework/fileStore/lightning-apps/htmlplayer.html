-->

    <style>

<!-- Starter function to fetch the url value from PersistentStore, format it & replace the current browser URL -->
<script>
function getValuePS(){
  // Mid-successive-playback: this page was loaded as one of the queued URLs, don't navigate away
  if (sessionStorage.getItem('successiveURLs')) return;
  if (sessionStorage.getItem('loadURL')) return;

  const WS_URL=WEBSOCKET_URL;
  const REQ={"jsonrpc":"2.0","id":2,"method":"org.rdk.PersistentStore.getValue","params":{"namespace":"MVS","key":"lightningURL"}};

  const formatUrl=(raw)=>{
    if(!raw) return '';
    let s=String(raw).trim();
    s=s.replace(/^%22|^%27|^["']/, '').replace(/%22$|%27$|["']$/, '');
    try{ const d=decodeURIComponent(s); if(/^https?:\/\//i.test(d)) s=d; }catch(_){}
    return s;
  };

  const handleResponse=(raw)=>{
    if(!raw) return;
    const value=String(raw).trim();

    // Check if the value is a JSON array (list) or a single URL
    let isList=false;
    let urls=null;
    try{
      const parsed=JSON.parse(value);
      if(Array.isArray(parsed)){
        isList=true;
        urls=parsed.map(u=>formatUrl(u)).filter(u=>/^https?:\/\//i.test(u));
      }
    }catch(_){}

    console.log('[HTML_getValuePS] Value is a '+(isList?'list of '+urls.length+' URL(s)':'single URL'));

    if(isList){
      if(!urls || urls.length === 0){
        console.log('[HTML_getValuePS] Parsed URL list is empty/invalid; ignoring successive playback');
        return;
      }
      sessionStorage.setItem('successiveURLs', JSON.stringify(urls));
      sessionStorage.setItem('successiveIndex', '0');
      sessionStorage.setItem('successiveResults', JSON.stringify([]));
      sessionStorage.setItem('loadURL', '1');
      window.location.replace(urls[0]);
    } else {
      const html_url=formatUrl(value);
      console.log('[HTML_getValuePS] The formatted URL obtained from PersistentStore: '+html_url);
      if(!html_url) return;
      sessionStorage.setItem('loadURL','1');
      console.log('[HTML_getValuePS] Loading the new URL obtained from PersistentStore');
      window.location.replace(html_url);
    }
  };

  try{
    const ws=new WebSocket(WS_URL);
    const to=setTimeout(()=>{ try{ws.close()}catch{} },WEBSOCKET_TIMEOUT);
    ws.onopen   =()=> ws.send(JSON.stringify(REQ));
    ws.onmessage=(e)=>{ clearTimeout(to); try{ handleResponse((JSON.parse(e.data)?.result?.value)||''); } finally{ try{ws.close()}catch{} } };
    ws.onerror  =()=>{ try{ws.close()}catch{} };
  }catch{}
}
getValuePS();
</script>

    <script>
        /*
           Implements: play/pause/seekpos/seekfwd/seekbwd/setPlaybackRate/volume/mute/unmute
        */

        /* ------------------------
           Globals & state
           ------------------------ */
        const videoEl = document.getElementById('vid');
        const eventStatus = document.getElementById('eventStatus');
        const vidTime = document.getElementById('vidTime');
        const fpsDisplay = document.getElementById('fpsDisplay'); /* FPS */

        let message = "";
        let message1 = "";
        let message2 = "";
        let inputs = window.location.search.substring(1).split("&");
        let videoURL = GetURLParameter("url").replace(/:and:/g, "&").replace(/:eq:/g, "=");
        let autotest = GetURLParameter("autotest")
        let urlType = GetURLParameter("type")
        // player=aamp drives native AAMP playback via the nativeplayer Thunder websocket (using the
        // launched aamp-player app's instanceId from the URL) instead of the HTML5 <video> element,
        // while reusing the shared validation/reporting logic.
        const selectedPlayer = (GetURLParameter("player") || "HTMLPlayer");
        const isAAMP = (selectedPlayer === "aamp");
        const AAMP_STATES = { Idle: 0, Initializing: 1, Initialized: 2, Preparing: 3, Prepared: 4, Buffering: 5, Paused: 6, Seeking: 7, Playing: 8, Stopping: 9, Stopped: 10, Complete: 11, Error: 12, Released: 13 };
        let expectedEvents = [];
        let observedEvents = [];
        let seekInterval = 10;
        let usedashlib = false;
        let usehlslib = false;
        let secondaryURL = "";
        let options = [];
        let configs = [];
        let DRMconfig = {};
        let licenseHeader = "";
        let preferredDRM = "";
        let expectedPos = "";
        let observedPos = "";
        let expectedRate = 0;
        let expectedRates = [];
        let observedRate = 0;
        let observedRates = [];
        let expectedVolume = "";
        let expectedMute = "";
        let observedMute = "";
        let volumeChangeFlag = 0;
        let audioChangeFlag = 0;
        let textChangeFlag = 0;
        let expectedAudioIndex = 0;
        let expectedTextIndex = 0;
        let audioTracksAvailability = 1;
        let textTracksAvailability = 1;
        let VideoBitrateChangeFlag = 0;
        let videoBitratesAvailability = 1;
        let expectedVideoBitrate = 0;
        let videoBitratesSelected = [];
        let SetVideoTrackFlag = 0;
        let expectedVideoTrack = 0;
        let availableVideoTrack = [];
        let SetThumbnailTrackFlag = 0;
        let availableThumbnailTrack = [];
        let expectedThumbnailTrack = 0;
        let SetAudioInfoFlag = 0;
        let SetTextInfoFlag = 0;
        let SetPlaybackFlag = 0;
        let SetPrefAudio = 0;
        let expectedPrefAudio = "";
        let pos_val_result = [];
        let pos_zero_index_flag = 0;
        let pos_end_flag = 0;
        let pos_list = [];
        let pos_val_flag = 0;
        let pos_val_index = 1;
        let eventFlowFlag = 1;
        let errorFlag = 0;
        let testStatus = 0;
        let check_end_duration = 0;
        let closeDuration = 0;
        let initFlag = 0;
        let vidDuration = 0;
        let delaytest = GetURLParameter("delaytest");
        let playbackSpeeds = isAAMP ? [-64, -32, -16, -4, 1, 4, 16, 32, 64] : [1, 2, 3, 4];
        let playbackRateIndex = playbackSpeeds.indexOf(1);
        let progressEventMsg = "";
        let progressLogger = null;
        let aampPlayRequestTs = 0;
        let aampPlayObservedTs = 0;
        let aampPlayStartPos = 0;
        let aampResumeFailed = false;
        let aampPlayValidationPending = false;
        const AAMP_PLAY_EVENT_GRACE_MS = 6000;
        const AAMP_PLAY_MOVEMENT_GRACE_MS = 2500;
        const AAMP_PLAY_TOTAL_SETTLE_MS = 12000;
        // AAMP-only: some content/sessions never emit a terminal onEOS/onStateChanged("complete")
        // notification over the websocket once playback reaches full duration, which would
        // otherwise leave playtillend() waiting silently until an external test harness's own
        // "no activity" watchdog times out first. Actively poll AAMP's live session state for a
        // bounded window instead, logging progress each time, before giving up as a failure.
        let aampPlaytillendDeadline = 0;
        const AAMP_PLAYTILLEND_FAIL_BUDGET_MS = 15000;
        // True while the above retry/poll loop is still running; a scheduled "close" action
        // (explicit in the operations list) must wait for this to clear so it doesn't cut the
        // retry loop off before it can log its final success/failure result.
        let aampPlaytillendPending = false;
        // Set true once the player has actually been closed (by either the explicit "close"
        // action or the auto-close fallback). dispTestResult() must wait for this so its
        // terminal "TEST RESULT" line (which the external test harness watches for and stops
        // on) can never race ahead of - and pre-empt - "Going to close" / closePlayer().
        let playerClosed = false;
        const SEEK_TOLERANCE = { lower: 2, upper: 7 }; //like [exp-2, exp+7]
        const interval = 1000;
        let checkInterval = 3000;
        const validationState = { initialPosCheckDone: false };

        /* ------------------------
           FPS state
           ------------------------ */
        let fpsList = [];
        let prevFrameCount = 0;
        let prevTimeStamp = 0;
        let fpsInterval = null;
        // FPS/dropped-frame metrics come from the HTML5 <video> element and are not applicable to
        // the native AAMP player, so they are disabled when player=aamp.
        let enable_fps_flag = isAAMP ? 0 : 1;
        let expectedFPS = DEFAULT_EXPECTED_FPS;
        let expectedFPSProvided = false;
        let droppedFramesTotal = 0;
        let prevDroppedCount = 0;

        inputs.forEach(item => {
            if (item.split("=")[0] == "drmconfigs") {
                var drm_configs = GetURLParameter("drmconfigs")
                if (drm_configs != "") {
                    configs = GetURLParameter("drmconfigs").split(",");
                }
            }
            else if (item.split("=")[0] == "options") {
                options = GetURLParameter("options").split(",");
            }
        });

        options.forEach(item => {
            if (item.includes("seekInterval")) {
                seekInterval = parseInt(item.split('(')[1].split(')')[0]);
            }
            else if (item.includes("checkInterval")) {
                checkInterval = parseInt(item.split('(')[1].split(')')[0]) * 1000;
            }
            else if (item.includes("useDashlib")) {
                var dashlib = item.split('(')[1].split(')')[0]
                if (dashlib == "yes" || dashlib == "YES")
                    usedashlib = true;
            }
            else if (item.includes("useHlslib")) {
                var hlslib = item.split('(')[1].split(')')[0]
                if (hlslib == "yes" || hlslib == "YES")
                    usehlslib = true;
            }
            else if (item.includes("secondaryURL")) {
                secondaryURL = item.split('(')[1].split(')')[0].replace(/:and:/g, "&").replace(/:eq:/g, "=");
            }
            else if (item.includes("collectfps")) {
                enable_fps_flag = 1;
            }
            else if (item.includes("expectedfps")) {
                expectedFPS = parseInt(item.split('(')[1].split(')')[0]);
                expectedFPSProvided = true;
            }
        });

        // Parse DRM options in the same style as Lightning AAMP player.
        configs.forEach(item => {
            if (item.includes("headers")) {
                licenseHeader = String(item.split('(')[1].split(')')[0]);
            } else if (item.includes("preferred")) {
                preferredDRM = String(item.split('(')[1].split(')')[0]);
                DRMconfig["preferredKeysystem"] = preferredDRM;
            } else {
                const drm = String(item.split('(')[0]);
                let licenseUrl = String(item.split('(')[1].split(')')[0]);
                licenseUrl = licenseUrl
                    .replace(/:and:/g, "&")
                    .replace(/:eq:/g, "=")
                    .replace(/:ob:/g, "(")
                    .replace(/:cb:/g, ")")
                    .replace(/:comma:/g, ",");
                DRMconfig[drm] = licenseUrl;
            }
        });

        // To display Events & Video position in UI
        function dispUIMessage(msg) {
            eventStatus.textContent = msg;
        }
        function dispUIVideoPosition(msg) {
            vidTime.textContent = msg;
        }

        /* ------------------------
           FPS Monitoring
           ------------------------ */
        function resetFPSMonitoring() {
            prevFrameCount = 0;
            prevTimeStamp = 0;
            prevDroppedCount = 0;
            droppedFramesTotal = 0;
            fpsList = [];
            if (fpsDisplay) {
                fpsDisplay.textContent = "FPS: 0.00";
            }
        }

        function startFPSMonitoring() {
            // FPS is measured from the HTML5 <video> element; not applicable to the native AAMP player.
            if (isAAMP) return;
            if (typeof videoEl.getVideoPlaybackQuality !== "function") {
                if (fpsDisplay) fpsDisplay.textContent = "FPS: N/A";
                logMsg("FPS API not supported: getVideoPlaybackQuality()");
                return;
            }

            if (fpsInterval) {
                clearInterval(fpsInterval);
                fpsInterval = null;
            }

            if (initFlag === 0) fpsList = [];
            try {
                const quality = videoEl.getVideoPlaybackQuality();
                prevFrameCount = typeof quality.totalVideoFrames === "number" ? quality.totalVideoFrames : 0;
                prevDroppedCount = typeof quality.droppedVideoFrames === "number" ? quality.droppedVideoFrames : 0;
                prevTimeStamp = performance.now();
            } catch (e) {
                prevFrameCount = 0;
                prevDroppedCount = 0;
                prevTimeStamp = performance.now();
                logMsg("FPS baseline init error: " + e);
            }

            fpsInterval = setInterval(() => {
                try {
                    if (videoEl.paused || videoEl.ended) return;

                    const quality = videoEl.getVideoPlaybackQuality();
                    const now = performance.now();
                    const totalFrames = typeof quality.totalVideoFrames === "number" ? quality.totalVideoFrames : 0;
                    const droppedFrames = typeof quality.droppedVideoFrames === "number" ? quality.droppedVideoFrames : 0;

                    // Accumulate dropped frames across all playback states
                    const deltaDropped = droppedFrames - prevDroppedCount;
                    if (deltaDropped > 0) droppedFramesTotal += deltaDropped;
                    prevDroppedCount = droppedFrames;

                    // Skip FPS sample and reset baseline during seek or non-1x playback
                    if (videoEl.seeking || videoEl.playbackRate !== 1) {
                        prevFrameCount = totalFrames;
                        prevTimeStamp = now;
                        if (fpsDisplay) fpsDisplay.textContent = "FPS: --";
                        return;
                    }

                    const deltaFrames = totalFrames - prevFrameCount;
                    const deltaTimeSec = (now - prevTimeStamp) / 1000;

                    let fps = 0;
                    if (deltaTimeSec > 0) {
                        fps = deltaFrames / deltaTimeSec;
                    }

                    prevFrameCount = totalFrames;
                    prevTimeStamp = now;

                    if (fps < 0) {
                        logMsg("Ignoring negative FPS value: " + fps.toFixed(2));
                        return;
                    }
                    fpsList.push(fps);

                    const fpsText = "FPS: " + fps.toFixed(2);
                    if (fpsDisplay) {
                        fpsDisplay.textContent = fpsText;
                    }

                    logMsg("Current FPS: " + fps.toFixed(2) +
                        ", Dropped Frames: " + droppedFrames);
                } catch (e) {
                    logMsg("FPS calculation error: " + e);
                }
            }, 1000);
        }

        function stopFPSMonitoring() {
            if (fpsInterval) {
                clearInterval(fpsInterval);
                fpsInterval = null;
            }
        }

        /* ------------------------
           LOGGING
           ------------------------ */
        function logMsg(msg) {
            const logging = GetURLParameter("logging");
            const inputs1 = window.location.search.substring(1).split("&");
            const player = GetURLParameter("player") || "HTML";
            const options1 = [];
            inputs1.forEach(item => {
                if (item.split("=")[0] === "options") {
                    options1.push(GetURLParameter("options").split(","));
                }
            });
            const log_msg = "[ " + dispTime() + " ] [" + player + "] " + msg;
            console.log(log_msg);
            if (logging === "REST_API") {
                if (msg.includes("TEST RESULT") || msg.includes("PLAYBACK RESULT") || msg.includes("Video PlayBack Failed")) {
                    pushAppLogs(log_msg);
                } else {
                    captureAppLogs(log_msg);
                }
            }
        }

        function logEventMsg(observedEvents, msg) {
            const logging = GetURLParameter("logging");
            const log_msg =
                "*****************************************************************\n" +
                "Observed Event: " + observedEvents + "\n" +
                "Event Details : " + "[ " + dispTime() + " ] " + msg + "\n" +
                "*****************************************************************";
            console.log(log_msg);
            if (logging === "REST_API") {
                pushAppLogs(log_msg);
            }
        }

        function dispTime() {
            const now = new Date();
            let h = now.getUTCHours();
            let m = now.getUTCMinutes();
            let s = now.getUTCSeconds();
            let ms = now.getUTCMilliseconds();

            if (h < 10) h = "0" + h;
            if (m < 10) m = "0" + m;
            if (s < 10) s = "0" + s;
            if (ms < 10) ms = "00" + ms;
            else if (ms < 100) ms = "0" + ms;

            return h + ":" + m + ":" + s + ":" + ms;
        }

        /* ------------------------
           Utility: URL parameter parsing
           ------------------------ */
        function GetURLParameter(sParam) {
            const sPageURL = window.location.search.substring(1);
            const sURLVariables = sPageURL.split('&');
            for (let i = 0; i < sURLVariables.length; i++) {
                const sParameterName = sURLVariables[i].split('=');
                if (sParameterName[0] === sParam) {
                    return sParameterName[1];
                }
            }
        }

        /* ------------------------
           Basic operations 
           ------------------------ */

        function load(autoplay = true) {
            const player = (GetURLParameter("player") || "HTMLPlayer");
            const _succURLs = sessionStorage.getItem('successiveURLs');
            if (_succURLs) {
                const _allURLs = JSON.parse(_succURLs);
                const _idx = parseInt(sessionStorage.getItem('successiveIndex') || '0');
                const _ordinals = ["first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth"];
                const _label = _idx < _ordinals.length ? _ordinals[_idx] : (_idx + 1) + "th";
                logMsg("Loading the " + _label + " stream URL (stream " + (_idx + 1) + " of " + _allURLs.length + "): " + videoURL);
            } else {
                logMsg("URL Info: " + videoURL);
            }
            logMsg("Selected Player : " + player);

            // --- Cleanup any existing players ---
            if (window.dashPlayer) {
                window.dashPlayer.reset();
                window.dashPlayer = null;
            }
            if (window.hlsPlayer) {
                window.hlsPlayer.destroy();
                window.hlsPlayer = null;
            }
            if (window.shakaPlayer) {
                window.shakaPlayer.destroy();
                window.shakaPlayer = null;
            }
            if (window.aampPlayer) {
                try { window.aampPlayer.stop(); } catch (e) { }
                window.aampPlayer = null;
            }

            let finalPlayer = player;

            // --- Player initialization ---
            switch (player) {
                case "dashjs":
                    if (typeof dashjs !== "undefined") {
                        logMsg("Initializing DASH player...",dashjs);

                        window.dashPlayer = dashjs.MediaPlayer().create();
                        window.dashPlayer.initialize(videoEl, videoURL, autoplay);

                        const dashEvents = dashjs.MediaPlayer.events;
                        window.dashPlayer.on(dashEvents.STREAM_INITIALIZED, () =>
                            logMsg("DASH: STREAM_INITIALIZED")
                        );
                        window.dashPlayer.on(dashEvents.ERROR, (e) =>
                            logMsg("DASH: ERROR - " + JSON.stringify(e))
                        );
                    } else {
                        logMsg("dashjs not available. Switching to HTMLPlayer.");
                        finalPlayer = "HTMLPlayer";
                    }
                    break;

                case "hls":
                    if (typeof Hls !== "undefined") {
                        logMsg("Initializing hls.js player...");
                        window.hlsPlayer = new Hls();
                        window.hlsPlayer.loadSource(videoURL);
                        window.hlsPlayer.attachMedia(videoEl);
                        window.hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                            logMsg("HLS: MANIFEST_PARSED");
                            if (autoplay) videoEl.play();
                        });
                    } else {
                        logMsg("hls.js not available. Switching to HTMLPlayer.");
                        finalPlayer = "HTMLPlayer";
                    }
                    break;

                case "shaka":
                    if (typeof shaka !== "undefined") {
                        logMsg("Initializing Shaka player...");
                        shaka.polyfill.installAll();
                        window.shakaPlayer = new shaka.Player(videoEl);
                        logMsg("SHAKA Player object created !!!");
                        window.shakaPlayer.load(videoURL)
                            .then(() => logMsg("SHAKA: Stream loaded"))
                            .catch((error) => logMsg("SHAKA Load Error: " + error));
                        logMsg("SHAKA Player loaded with video url");
                    } else {
                        logMsg("Shaka not available. Switching to HTMLPlayer.");
                        finalPlayer = "HTMLPlayer";
                    }
                    break;

                case "aamp":
                    // Native AAMP playback runs over the nativeplayer Thunder websocket using the
                    // already-launched aamp-player app's instanceId (passed in via the URL).
                    window.aampPlayer = new NativePlayer(GetURLParameter("namespace") || "org.rdk.nativeplayer");
                    logMsg("AAMP native player driver created !!!");
                    setupAAMPPlayer(autoplay);
                    break;

                default:
                    finalPlayer = "HTMLPlayer";
                    break;
            }

            // --- Validation: ensure player initialized properly ---
            let isValid = false;

            if (finalPlayer === "dashjs" && window.dashPlayer) isValid = true;
            else if (finalPlayer === "hls" && window.hlsPlayer) isValid = true;
            else if (finalPlayer === "shaka" && window.shakaPlayer) isValid = true;
            else if (finalPlayer === "aamp" && window.aampPlayer) isValid = true;
            else if (finalPlayer === "HTMLPlayer") isValid = true;

            if (!isValid) {
                logMsg(`[Validation] Player initialization failed. Falling back to HTMLPlayer.`);
                finalPlayer = "HTMLPlayer";
            }

            // --- HTMLPlayer fallback ---
            if (finalPlayer === "HTMLPlayer") {
                logMsg("Using HTML5 video element (HTMLPlayer).");
                videoEl.src = videoURL;
                const sourceEl = videoEl.querySelector("source");
                if (sourceEl) sourceEl.src = videoURL;
                videoEl.load();
                videoEl.autoplay = autoplay;
            }

            logMsg(`Final Player Loaded: ${finalPlayer}\n`);
        }

        /* ------------------------
           AAMP native player (nativeplayer Thunder websocket) integration
           ------------------------ */

        // Events registered on the nativeplayer session (mirrors aampplayer.py DEFAULT_EVENTS).
        const AAMP_NATIVE_EVENTS = [
            "onProgress", "onStateChanged", "onSpeedChanged", "onSpeedsChanged", "onSeeked",
            "onEOS", "onTuneFailed", "onBitrateChanged", "onBufferingChanged", "onMediaMetadata",
            "onMonitorAVStatus", "onManifestRefresh"
        ];
        const AAMP_WS_CONNECT_RETRIES = 30;
        const AAMP_OPEN_SESSION_RETRIES = 3;

        // Minimal JSON-RPC client for org.rdk.nativeplayer over a Thunder websocket. htmlplayer.html
        // runs on the device, so it reaches the loopback nativeplayer socket directly (no SSH tunnel).
        class NativePlayer {
            constructor(namespace) {
                this.namespace = namespace;
                this.ws = null;
                this.sessionId = null;
                this.msgId = 1;
                this.pending = {};
                this.eventIndex = 1;
                this.externalEventHandlers = {};
                // State tracked from event notifications (nativeplayer has no synchronous getters).
                this.lastPosition = 0;
                this.lastDuration = 0;
                this.lastSpeed = 1;
                this.stateNum = AAMP_STATES.Idle;
                this.muted = false;
                this.volume = 100;
                this.currentRate = 1;
                this.lastUrl = "";
                // Trick-play speeds the current content actually advertises as supported, learned
                // from onMediaMetadata (at tune time) / onSpeedsChanged (if it changes later). Null
                // until the first one arrives, since not every stream/profile reports it.
                this.supportedSpeeds = null;
            }

            connect(url) {
                return new Promise((resolve, reject) => {
                    let ws;
                    try { ws = new WebSocket(url); } catch (e) { reject(e); return; }
                    ws.onopen = () => { this.ws = ws; resolve(); };
                    ws.onerror = (e) => reject(e);
                    ws.onclose = () => { };
                    ws.onmessage = (e) => this._onMessage(e.data);
                });
            }

            _onMessage(raw) {
                let msg;
                try { msg = JSON.parse(raw); } catch (e) { return; }
                if (msg.id !== undefined && this.pending[msg.id]) {
                    const p = this.pending[msg.id];
                    delete this.pending[msg.id];
                    if (msg.error) p.reject(new Error(JSON.stringify(msg.error)));
                    else p.resolve(msg.result);
                    return;
                }
                // Notifications arrive as "<registered-event-id>.<eventName>", e.g. "events.1.onProgress".
                if (msg.method) {
                    const eventName = String(msg.method).split(".").pop();
                    handleAAMPNativeEvent(eventName, msg.params || {});
                    const handlers = this.externalEventHandlers[eventName] || [];
                    handlers.forEach((handler) => {
                        try { handler(msg.params || {}); } catch (e) { logMsg("External event handler error for " + eventName + ": " + e); }
                    });
                }
            }

            _call(method, params) {
                return new Promise((resolve, reject) => {
                    if (!this.ws) { reject(new Error("websocket not connected")); return; }
                    const id = this.msgId++;
                    this.pending[id] = { resolve, reject };
                    const payload = { jsonrpc: "2.0", id, method: this.namespace + "." + method };
                    if (params !== undefined) payload.params = params;
                    try { this.ws.send(JSON.stringify(payload)); }
                    catch (e) { delete this.pending[id]; reject(e); return; }
                    setTimeout(() => {
                        if (this.pending[id]) { delete this.pending[id]; reject(new Error("timeout waiting for " + method)); }
                    }, 15000);
                });
            }

            async openSession(instanceId) {
                const result = await this._call("openSession", { instanceId: instanceId, displayId: "wst-" + instanceId });
                this.sessionId = (result && result.sessionId) ? result.sessionId : result;
                if (!this.sessionId) throw new Error("openSession did not return a sessionId");
                return this.sessionId;
            }

            async registerAllEvents(events) {
                for (const event of events) {
                    try { await this._call("register", { event: event, id: "events." + (this.eventIndex++) }); }
                    catch (e) { logMsg("Failed to register event " + event + ": " + e); }
                }
            }

            // UVE compatibility helpers mapped to nativeplayer OpenRPC session APIs.
            load(url, autoPlay = true) { return this.tune(url, autoPlay); }
            initConfig(config) { return this._call("configureSession", { sessionId: this.sessionId, config: config }); }
            setDRMConfig(config) { return this._call("configureSession", { sessionId: this.sessionId, config: config }); }
            addCustomHTTPHeader(headerName, headerValue, isLicenseRequest = true) {
                return this._call("addCustomHTTPHeader", {
                    sessionId: this.sessionId,
                    headerName: headerName,
                    headerValue: headerValue,
                    isLicenseRequest: isLicenseRequest
                });
            }
            play() { return this.resume(); }
            tune(url, autoPlay = true) {
                this.lastUrl = url;
                return this._call("play", { url: url, autoPlay: autoPlay, sessionId: this.sessionId });
            }
            resume() {
                // Some nativeplayer builds need fallbacks after pauseAt(-1), so keep this resilient.
                const waitMs = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
                const markPlaying = () => { this.currentRate = 1; this.lastSpeed = 1; };
                const resumeStartPos = Number(this.lastPosition || 0);
                const hasAdvanced = () => Number(this.lastPosition || 0) > (resumeStartPos + 0.2);
                // lastPosition is normally only refreshed by push onProgress events, which can be
                // throttled/batched by the backend and make an already-resumed player look stalled.
                // Actively poll the live position via RPC here so we don't rely solely on that push telemetry.
                const refreshPosition = async () => {
                    try { await this.getPlaybackPositionFromSession(); } catch (e) { }
                };
                const isPlayingNow = async () => {
                    if (hasAdvanced()) return true;
                    try {
                        const state = await this.getStateFromSession();
                        if (aampNativeStateToNum(state) === AAMP_STATES.Playing) {
                            await refreshPosition();
                            if (hasAdvanced()) return true;
                        }
                    } catch (e) { }
                    try {
                        const rate = await this.getPlaybackRateFromSession();
                        if (Number(rate) > 0) {
                            await refreshPosition();
                            if (hasAdvanced()) return true;
                        }
                    } catch (e) { }
                    return false;
                };
                const waitForPlaying = async (timeoutMs = 2000, pollMs = 150) => {
                    const start = Date.now();
                    while ((Date.now() - start) < timeoutMs) {
                        if (await isPlayingNow()) return true;
                        await waitMs(pollMs);
                    }
                    // Small tail grace for async state/event propagation.
                    await waitMs(300);
                    if (await isPlayingNow()) return true;
                    return false;
                };

                const attempts = [
                    {
                        // Per the full OpenRPC JSON-RPC spec for pauseAt: "Pass a negative value to
                        // cancel a previously scheduled pause." Our pause() schedules a pause at the
                        // current position (pauseAt(currentPosition)), so cancelling that scheduled
                        // pause is the documented way to resume.
                        label: "pauseAt(-1)",
                        waitMs: 3000,
                        fn: () => this._call("pauseAt", { sessionId: this.sessionId, position: -1 })
                    },
                    {
                        label: "setRate(1)",
                        waitMs: 1600,
                        fn: () => this._call("setRate", { sessionId: this.sessionId, rate: 1, overshootCorrection: 0 })
                    },
                    {
                        label: "setPlaybackSpeed(1)",
                        waitMs: 1600,
                        fn: () => this._call("setPlaybackSpeed", { sessionId: this.sessionId, speed: 1 })
                    }
                ];

                return (async () => {
                    let lastError = null;
                    for (const attempt of attempts) {
                        try {
                            const result = await attempt.fn();
                            markPlaying();
                            if (await waitForPlaying(attempt.waitMs || 2000)) {
                                return result;
                            }
                            // Suppress noisy intermediate warning; next fallback attempts still run and
                            // real failures are reported if all resume strategies fail.
                        } catch (err) {
                            lastError = err;
                            logMsg("[WARN]: Resume attempt failed: " + attempt.label + " - " + err);
                        }
                    }
                    throw (lastError || new Error("resume failed: player did not transition to Playing"));
                })();
            }
            pause() { return this._call("pauseAt", { sessionId: this.sessionId, position: this.lastPosition }); }
            seek(sec, keepPaused = false) { return this._call("seek", { sessionId: this.sessionId, position: sec, keepPaused: keepPaused }); }
            setPlaybackRate(rate, overshootCorrection = 0) {
                this.currentRate = rate;
                return this._call("setRate", { sessionId: this.sessionId, rate: rate, overshootCorrection: overshootCorrection });
            }
            setMute(muted) { this.muted = muted; return this._call("setVideoMute", { sessionId: this.sessionId, muted: muted }).then(() => this.refreshMute()); }
            refreshMute() {
                return this._call("getVideoMute", { sessionId: this.sessionId }).then(r => {
                    if (r && r.muted !== undefined) this.muted = !!r.muted;
                    else if (r && r.videoMuted !== undefined) this.muted = !!r.videoMuted;
                    else this.muted = !!r;
                    return this.muted;
                }).catch(() => this.muted);
            }
            setVolume(volume) { this.volume = volume; return this._call("setAudioVolume", { sessionId: this.sessionId, volume: volume }); }
            getAudioVolumeFromSession() {
                return this._call("getAudioVolume", { sessionId: this.sessionId }).then(r => {
                    const volume = (r && r.volume !== undefined) ? Number(r.volume) : Number(r || this.volume);
                    this.volume = isNaN(volume) ? this.volume : volume;
                    return this.volume;
                });
            }
            setPlaybackSpeed(speed) {
                this.currentRate = speed;
                return this._call("setPlaybackSpeed", { sessionId: this.sessionId, speed: speed });
            }
            seekToLive(keepPaused = false) { return this._call("seekToLive", { sessionId: this.sessionId, keepPaused: keepPaused }); }
            isLive() {
                return this._call("isLive", { sessionId: this.sessionId }).then(r => {
                    if (r && r.isLive !== undefined) return !!r.isLive;
                    return !!r;
                });
            }
            getStateFromSession() {
                return this._call("getState", { sessionId: this.sessionId }).then(r => {
                    const state = (r && r.state !== undefined) ? r.state : r;
                    this.stateNum = aampNativeStateToNum(state);
                    return state;
                });
            }
            getPlaybackPositionFromSession() {
                return this._call("getPlaybackPosition", { sessionId: this.sessionId }).then(r => {
                    const pos = (r && r.position !== undefined) ? Number(r.position) : Number(r || 0);
                    this.lastPosition = isNaN(pos) ? this.lastPosition : pos;
                    return this.lastPosition;
                });
            }
            getPlaybackDurationFromSession() {
                return this._call("getPlaybackDuration", { sessionId: this.sessionId }).then(r => {
                    const dur = (r && r.duration !== undefined) ? Number(r.duration) : Number(r || 0);
                    this.lastDuration = isNaN(dur) ? this.lastDuration : dur;
                    return this.lastDuration;
                });
            }
            getPlaybackRateFromSession() {
                return this._call("getPlaybackRate", { sessionId: this.sessionId }).then(r => {
                    const rate = (r && r.rate !== undefined) ? Number(r.rate) : Number(r || 1);
                    this.lastSpeed = isNaN(rate) ? this.lastSpeed : rate;
                    return this.lastSpeed;
                });
            }
            getAudioLanguage() {
                return this._call("getAudioLanguage", { sessionId: this.sessionId }).then(r => {
                    if (r && r.language !== undefined) return r.language;
                    return r;
                });
            }
            getAvailableAudioTracks(allTracks = false) {
                return this._call("getAvailableAudioTracks", { sessionId: this.sessionId, allTracks: allTracks }).then(r => {
                    if (r && r.tracks !== undefined) return r.tracks;
                    return r;
                });
            }
            setAudioTrack(trackId) { return this._call("setAudioTrack", { sessionId: this.sessionId, trackId: trackId }); }
            getAudioTrack() {
                return this._call("getAudioTrack", { sessionId: this.sessionId }).then(r => {
                    if (r && r.trackId !== undefined) return r.trackId;
                    return r;
                });
            }
            getAudioTrackInfo() {
                return this._call("getAudioTrackInfo", { sessionId: this.sessionId }).then(r => {
                    if (r && r.trackInfo !== undefined) return r.trackInfo;
                    return r;
                });
            }
            setSubtitleMute(muted) { return this._call("setSubtitleMute", { sessionId: this.sessionId, muted: muted }); }
            setClosedCaptionStatus(enable) { return this.setSubtitleMute(!enable); }
            getAvailableTextTracks(allTracks = false) {
                return this._call("getAvailableTextTracks", { sessionId: this.sessionId, allTracks: allTracks }).then(r => {
                    if (r && r.tracks !== undefined) return r.tracks;
                    return r;
                });
            }
            setTextTrack(trackId) { return this._call("setTextTrack", { sessionId: this.sessionId, trackId: trackId }); }
            getTextTrack() {
                return this._call("getTextTrack", { sessionId: this.sessionId }).then(r => {
                    if (r && r.trackId !== undefined) return r.trackId;
                    return r;
                });
            }
            getTextTrackInfo() {
                return this._call("getTextTrackInfo", { sessionId: this.sessionId }).then(r => {
                    if (r && r.trackInfo !== undefined) return r.trackInfo;
                    return r;
                });
            }
            setVideoRect(x, y, w, h) {
                return this._call("setVideoRectangle", { sessionId: this.sessionId, x: x, y: y, w: w, h: h })
                    .catch((err) => {
                        logMsg("[WARN]: setVideoRectangle failed, trying setVideoRect fallback: " + err);
                        return this._call("setVideoRect", { sessionId: this.sessionId, x: x, y: y, w: w, h: h });
                    });
            }
            getVideoRectangle() { return this._call("getVideoRectangle", { sessionId: this.sessionId }); }
            setAudioLanguage(language) {
                return this._call("setAudioLanguage", { sessionId: this.sessionId, language: language })
                    .catch((err) => {
                        logMsg("[WARN]: setAudioLanguage failed, trying setPreferredLanguages fallback: " + err);
                        return this._call("setPreferredLanguages", { sessionId: this.sessionId, languageList: language });
                    });
            }
            getVideoBitrates() { return this._call("getVideoBitrates", { sessionId: this.sessionId }); }
            getCurrentVideoBitrate() { return this._call("getCurrentVideoBitrate", { sessionId: this.sessionId }); }
            setVideoBitrate(bitrate) { return this._call("setVideoBitrate", { sessionId: this.sessionId, bitrate: bitrate }); }
            getCurrentAudioBitrate() { return this._call("getCurrentAudioBitrate", { sessionId: this.sessionId }); }
            getAvailableVideoTracks() { return this._call("getAvailableVideoTracks", { sessionId: this.sessionId }); }
            setVideoTracks(bandwidth) { return this._call("setVideoTracks", { sessionId: this.sessionId, bandwidth: bandwidth }); }
            getAvailableThumbnailTracks() { return this._call("getAvailableThumbnailTracks", { sessionId: this.sessionId }); }
            setThumbnailTrack(index) {
                return this._call("setThumbnailTrack", { sessionId: this.sessionId, index: index })
                    .catch((err) => {
                        logMsg("[WARN]: setThumbnailTrack(index) failed, trying trackId fallback: " + err);
                        return this._call("setThumbnailTrack", { sessionId: this.sessionId, trackId: index });
                    });
            }
            getPlaybackStatistics() { return this._call("getPlaybackStatistics", { sessionId: this.sessionId }); }
            getManifest() { return this._call("getManifest", { sessionId: this.sessionId }); }
            setPreferredAudioLanguage(language) {
                return this._call("setPreferredLanguages", { sessionId: this.sessionId, languageList: language })
                    .catch((err) => {
                        logMsg("[WARN]: setPreferredLanguages failed, trying setPreferredAudioLanguage fallback: " + err);
                        return this._call("setPreferredAudioLanguage", { sessionId: this.sessionId, language: language });
                    });
            }
            getPreferredAudioProperties() {
                return this._call("getPreferredLanguages", { sessionId: this.sessionId })
                    .then((r) => {
                        if (r && r.languageList !== undefined) return r;
                        return r;
                    })
                    .catch((err) => {
                        logMsg("[WARN]: getPreferredLanguages failed, trying getPreferredAudioProperties fallback: " + err);
                        return this._call("getPreferredAudioProperties", { sessionId: this.sessionId });
                    });
            }
            addEventListener(eventName, eventHandler) {
                if (!this.externalEventHandlers[eventName]) this.externalEventHandlers[eventName] = [];
                this.externalEventHandlers[eventName].push(eventHandler);
                return this._call("register", { event: eventName, id: "events." + (this.eventIndex++) });
            }
            stop() {
                if (!this.ws || !this.sessionId) return Promise.resolve();
                return this.closeSession()
                    .catch(() => { })
                    .then(() => { try { this.ws.close(); } catch (e) { } });
            }

            // Closes the nativeplayer session, if one was opened. Safe to call even when a later
            // setup step (configureSession/register/play) failed after openSession succeeded, so a
            // half-initialized session is never left orphaned on the device.
            async closeSession() {
                if (!this.sessionId) return;
                const sessionId = this.sessionId;
                this.sessionId = null;
                try { await this._call("stop", { sessionId: sessionId }); } catch (e) { }
                await this._call("closeSession", { sessionId: sessionId });
            }

            // Synchronous getters backed by tracked event state (used by the shared validation flow).
            getCurrentPosition() { return this.lastPosition; }
            getDurationSec() { return this.lastDuration; }
            getCurrentState() { return this.stateNum; }
            getPlaybackRate() { return this.lastSpeed; }
            getVolume() { return this.volume; }
            getMute() { return this.muted; }
        }

        // Connects to the nativeplayer session for the already-launched aamp-player app and starts playback.
        async function setupAAMPPlayer(autoplay) {
            const instanceId = GetURLParameter("instanceid") || "";
            const wsPort = parseInt(GetURLParameter("wsport") || AAMP_NATIVEPLAYER_WS_PORT);
            videoEl.removeAttribute('autoplay');
            videoEl.querySelectorAll('source').forEach(s => s.removeAttribute('src'));
            videoEl.removeAttribute('src');

            if (!instanceId) {
                errorFlag = 1;
                logMsg("[ERROR]: No aamp-player instanceid provided in URL; cannot start native playback");
                logMsg("TEST RESULT : FAILURE");
                return;
            }

            const player = window.aampPlayer;
            const wsUrl = AAMP_NATIVEPLAYER_WS_HOST + ":" + wsPort;
            let connected = false;
            for (let attempt = 0; attempt < AAMP_WS_CONNECT_RETRIES && !connected; attempt++) {
                try { await player.connect(wsUrl); connected = true; }
                catch (e) { await new Promise(r => setTimeout(r, 2000)); }
            }
            if (!connected) {
                errorFlag = 1;
                logMsg("[ERROR]: Could not connect to nativeplayer websocket at " + wsUrl);
                logMsg("TEST RESULT : FAILURE");
                return;
            }

            try {
                // logMsg("Connected to nativeplayer websocket at " + wsUrl);
                // The nativeplayer app's websocket can accept a connection before its backend session
                // manager is fully initialized (observed as app lifecycleState still
                // APP_STATE_INITIALIZING), so openSession can time out on the first attempt even though
                // the connection itself succeeded. Retry a few times before giving up.
                let sessionId;
                let openSessionError = null;
                for (let attempt = 1; attempt <= AAMP_OPEN_SESSION_RETRIES; attempt++) {
                    try {
                        sessionId = await player.openSession(instanceId);
                        openSessionError = null;
                        break;
                    } catch (e) {
                        openSessionError = e;
                        if (attempt < AAMP_OPEN_SESSION_RETRIES) {
                            logMsg("[WARN]: openSession attempt " + attempt + " failed: " + e + "; retrying...");
                            await new Promise(r => setTimeout(r, 2000));
                        }
                    }
                }
                if (openSessionError) throw openSessionError;
                // logMsg("Received the session id: " + sessionId);
                // Align with Lightning setPlayerConfig defaults to ensure consistent progress/event cadence.
                await player.initConfig({
                    initialBitrate: 2500000,
                    offset: 0,
                    networkTimeout: 10,
                    preferredAudioLanguage: "en",
                    liveOffset: 15,
                    progressReportingInterval: 1,
                    drmConfig: {}
                });
                if (Object.keys(DRMconfig).length !== 0) {
                    await player.setDRMConfig(DRMconfig);
                    if (licenseHeader) {
                        const sep = licenseHeader.indexOf(":");
                        if (sep > 0) {
                            const headerTag = licenseHeader.slice(0, sep);
                            const headerVal = licenseHeader.slice(sep + 1);
                            await player.addCustomHTTPHeader(headerTag, headerVal);
                        }
                    }
                }
                await player.registerAllEvents(AAMP_NATIVE_EVENTS);
                logMsg("AAMP player loaded with video url: " + videoURL + "\n");
                await player.tune(videoURL, autoplay);
                logMsg("Video Playback Started !!!");
            } catch (e) {
                errorFlag = 1;
                logMsg("[ERROR]: AAMP native playback setup failed: " + e);
                // A session may have been opened (openSession succeeded) even though a later setup
                // step (configureSession/register/play) failed; close it mandatorily so the device
                // doesn't retain an orphaned, half-initialized nativeplayer session.
                if (player.sessionId) {
                    const orphanedSessionId = player.sessionId;
                    logMsg("[INFO]: Closing nativeplayer session " + orphanedSessionId + " after setup failure");
                    try {
                        await player.closeSession();
                        logMsg("[INFO]: Session " + orphanedSessionId + " closed successfully after setup failure");
                    } catch (closeErr) {
                        logMsg("[WARN]: Failed to close session " + orphanedSessionId + " after setup failure: " + closeErr);
                    }
                }
                logMsg("TEST RESULT : FAILURE");
            }
        }

        // Maps a nativeplayer onStateChanged state (string or numeric) to an AAMP_STATES value.
        function aampNativeStateToNum(state) {
            const s = String(state).toLowerCase();
            if (s.indexOf("play") >= 0) return AAMP_STATES.Playing;
            if (s.indexOf("paus") >= 0) return AAMP_STATES.Paused;
            if (s.indexOf("seek") >= 0) return AAMP_STATES.Seeking;
            if (s.indexOf("error") >= 0 || s.indexOf("fail") >= 0) return AAMP_STATES.Error;
            // "complete" is the documented PlayerState AAMP reports via onStateChanged when
            // playback reaches end-of-stream. Some content/sessions only signal EOS this way and
            // never emit a separate onEOS notification, so this must be recognized here too --
            // otherwise playtillend() has no way to observe "ended" and hangs indefinitely.
            if (s.indexOf("complete") >= 0) return AAMP_STATES.Complete;
            if (s.indexOf("stop") >= 0) return AAMP_STATES.Stopped;
            return AAMP_STATES.Idle;
        }

        function aampExtractPosition(params) {
            if (params.positionMs !== undefined) return params.positionMs / 1000.0;
            if (params.position !== undefined) return params.position;
            return null;
        }
        function aampExtractDuration(params) {
            if (params.durationMs !== undefined) return params.durationMs / 1000.0;
            if (params.endMs !== undefined) return params.endMs / 1000.0;
            if (params.duration !== undefined) return params.duration;
            return null;
        }

        // Central handler for nativeplayer event notifications; feeds the shared validation flow.
        function handleAAMPNativeEvent(name, params) {
            const player = window.aampPlayer;
            switch (name) {
                case "onProgress": {
                    const position = aampExtractPosition(params);
                    const duration = aampExtractDuration(params);
                    if (position !== null) player.lastPosition = position;
                    if (duration !== null) player.lastDuration = duration;
                    if (params.speed !== undefined) player.lastSpeed = params.speed;
                    const logPosition = (position !== null) ? position : player.lastPosition;
                    const logDuration = (duration !== null) ? duration : player.lastDuration;
                    if (initFlag === 0 && position !== null && logDuration !== null && logDuration > 0) {
                        vidDuration = logDuration;
                        logMsg("******************* VIDEO STARTED PLAYING !!! *******************");
                        logMsg("VIDEO DURATION: " + logDuration.toFixed(4));
                        checkAndStartAutoTesting();
                        initFlag = 1;
                        pos_val_flag = 1;
                    }
                    if (logDuration !== null && logDuration > 0) {
                        message2 = "Pos: " + logPosition.toFixed(2) + "/" + logDuration.toFixed(2);
                        dispUIVideoPosition(message2);
                        progressEventMsg = "Video Progressing " + logPosition.toFixed(2) + "/" + logDuration.toFixed(2);
                        logMsg(progressEventMsg);
                        if (check_end_duration === 1 && parseInt(logPosition) >= (parseInt(closeDuration) - 3)) {
                            pos_end_flag = 1;
                        }
                    }
                    if (position !== null && pos_val_flag === 1) {
                        pos_list.push(position.toFixed(2));
                    }
                    break;
                }
                case "onStateChanged": {
                    const stateNum = aampNativeStateToNum(params.state);
                    player.stateNum = stateNum;
                    if (stateNum === AAMP_STATES.Playing) {
                        aampPlayObservedTs = Date.now();
                        observedEvents.push("play");
                        checkAndLogEvents("play", "Video Player Playing");
                        updatePosValidationInfo(1);
                    } else if (stateNum === AAMP_STATES.Paused) {
                        observedEvents.push("pause");
                        checkAndLogEvents("pause", "Video Player Paused");
                        if (pos_zero_index_flag) { pos_zero_index_flag = 0; updatePosValidationInfo(0); }
                    } else if (stateNum === AAMP_STATES.Seeking) {
                        observedEvents.push("seeking");
                        checkAndLogEvents("seeking", "Video Player Seeking");
                    } else if (stateNum === AAMP_STATES.Complete) {
                        // Fallback path for end-of-stream: not every stream/session emits a
                        // separate onEOS notification, but AAMP always transitions to the
                        // "complete" PlayerState when playback reaches the end. Push "ended" here
                        // too (observedEvents dedup isn't required -- includes()/every() checks
                        // elsewhere only care about presence) so playtillend() isn't solely
                        // dependent on onEOS actually arriving.
                        if (!observedEvents.includes("ended")) {
                            observedEvents.push("ended");
                            dispUIMessage("[Event]: Video Player Ended");
                            logMsg("Video PlayBack Completed !!!");
                        }
                    } else if (stateNum === AAMP_STATES.Error) {
                        errorFlag = 1;
                        dispUIMessage("[ERROR]: Video Player Error");
                        logMsg("Video Player Error !!!");
                    }
                    break;
                }
                case "onSpeedChanged": {
                    if (params.speed !== undefined) {
                        player.lastSpeed = params.speed;
                        observedEvents.push("ratechange");
                        observedRates.push(params.speed);
                        observedRate = params.speed;
                        checkAndLogEvents("ratechange", "Video Player Rate Change to " + observedRate);
                        if (params.speed !== 0) {
                            // Validate progress against the rate we requested (expectedRate), not
                            // just whatever AAMP reports back. This way, if AAMP silently fails to
                            // honor the requested trick-play rate (e.g. asked for 4x but stays at
                            // 1x), the position-diff check flags the mismatch too, instead of
                            // masking it by validating against the (unchanged) observed speed.
                            // Covers rewind (negative) rates too, not just fast-forward, so
                            // position samples actually get captured for rewind operations
                            // instead of leaving pos_list empty and silently failing without any
                            // mismatch details.
                            let rate_index = (expectedEvents.includes("ratechange") && expectedRate !== 0)
                                ? expectedRate
                                : params.speed;
                            if (rate_index === 16) rate_index = 10;
                            updatePosValidationInfo(rate_index);
                        }
                    }
                    break;
                }
                // onSpeedsChanged/onMediaMetadata carry a "supportedSpeeds" array (the trick-play
                // rates this content's manifest actually advertises), not a "speed" value -- track
                // it so setPlaybackRate() can warn when a requested rate isn't in that list instead
                // of silently failing with no explanation.
                case "onSpeedsChanged": {
                    if (Array.isArray(params.supportedSpeeds)) {
                        player.supportedSpeeds = params.supportedSpeeds;
                        // logMsg("Supported trick-play speeds updated: [" + params.supportedSpeeds.join(", ") + "]");
                    }
                    break;
                }
                case "onMediaMetadata": {
                    if (Array.isArray(params.supportedSpeeds)) {
                        player.supportedSpeeds = params.supportedSpeeds;
                        // logMsg("Supported trick-play speeds: [" + params.supportedSpeeds.join(", ") + "]");
                    }
                    break;
                }
                case "onSeeked": {
                    observedEvents.push("seeked");
                    const pos = aampExtractPosition(params);
                    if (pos !== null) observedPos = Math.round(pos);
                    checkAndLogEvents("seeked", "Video Player Seeked " + observedPos + "/" + getDuration().toFixed(2));
                    updatePosValidationInfo(1);
                    break;
                }
                case "onEOS": {
                    if (!observedEvents.includes("ended")) {
                        observedEvents.push("ended");
                        dispUIMessage("[Event]: Video Player Ended");
                        logMsg("Video PlayBack Completed !!!");
                    }
                    break;
                }
                case "onTuneFailed": {
                    errorFlag = 1;
                    logMsg("Event Occurred: onTuneFailed !!!");
                    logMsg("Video PlayBack Failed !!!");
                    break;
                }
                default:
                    break;
            }
        }

        function play() {
            expectedEvents = ["play"];
            logMsg("Expected Event: " + expectedEvents);
            if (isAAMP) {
                aampPlayRequestTs = Date.now();
                aampPlayStartPos = Number(window.aampPlayer.getCurrentPosition() || 0);
                aampPlayObservedTs = 0;
                aampResumeFailed = false;
                aampPlayValidationPending = true;
                window.aampPlayer.resume().catch((e) => {
                    aampResumeFailed = true;
                });
                return;
            }
            videoEl.playbackRate = 1;
            // Use promise to ensure play request success
            const playPromise = videoEl.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    logMsg("Video play request successful");
                }).catch(err => {
                    eventFlowFlag = 0;
                    logMsg("Video play request failed: " + err);
                });
            }
        }

        function pause() {
            expectedEvents = ["pause"];
            logMsg("Expected Event: " + expectedEvents);

        function closePlayer() {
            if (isAAMP) {
                if (window.aampPlayer) window.aampPlayer.stop();

        // Methods to change video position
        function seek(timeSec, keepPause = false) {
            // Don't push "seeking" here proactively -- the real onStateChanged (Seeking) event
            // already pushes it when AAMP actually transitions, so pushing it here too would
            // double it up in observedEvents (e.g. "seeking,seeking,seeked").
            if (isAAMP) { window.aampPlayer.seek(timeSec, keepPause); return; }
            videoEl.currentTime = Math.max(0, Math.min(timeSec, videoEl.duration));
        }
        function seekfwd(pos) {
            expectedEvents = ["seeking", "seeked"]
            expectedPos = Math.floor(getPosition() + pos)
            logMsg("Expected Event: " + expectedEvents)
            logMsg("Expected Pos  : [ " + (expectedPos - 2) + " - " + (expectedPos + 7) + " ]")
            seek(expectedPos)
        }
        function seekbwd(pos) {
            expectedEvents = ["seeking", "seeked"]
            expectedPos = Math.floor(getPosition() - pos)
            logMsg("Expected Event: " + expectedEvents)
            logMsg("Expected Pos  : [ " + (expectedPos - 2) + " - " + (expectedPos + 7) + " ]")
            seek(expectedPos)
        }
        function seekpos(pos) {
            expectedEvents = ["seeking", "seeked"]
            expectedPos = pos
            logMsg("Expected Event: " + expectedEvents)
            logMsg("Expected Pos  : [ " + (expectedPos).toFixed(2) + " - " + (expectedPos + 7).toFixed(2) + " ]")
            if (isAAMP) { seek(pos); return; }
            videoEl.currentTime = pos
        }
        function getPosition() {
            if (isAAMP) { const p = window.aampPlayer.getCurrentPosition(); return Number((p || 0).toFixed(2)); }
            return Number(videoEl.currentTime.toFixed(2));
        }
        function getDuration() {
            if (isAAMP) { const d = window.aampPlayer.getDurationSec(); return Number(d ? d.toFixed(2) : 0); }
            return Number(videoEl.duration ? videoEl.duration.toFixed(2) : 0);
        }

        function playNow() {
            playbackRateIndex = playbackSpeeds.indexOf(1);
            var rate = playbackSpeeds[playbackRateIndex];
            setPlaybackRate(rate);
        }

        /* playback rate */
        function setPlaybackRate(rate) {
            if (isNaN(rate) || rate === 0) { logMsg("Invalid rate"); return; }
            if (isAAMP) {
                expectedEvents = ["ratechange"];
                expectedRate = rate;
                observedRates = [];
                logMsg("Expected Event: " + expectedEvents);
                logMsg("Expected Rate: " + rate);
                // Diagnostic only (doesn't change validation behavior): if the content has already
                // advertised its supported trick-play speeds via onMediaMetadata/onSpeedsChanged
                // and the requested rate isn't in that list, the upcoming ratechange-to-1 fallback
                // is expected from AAMP, not a bug -- log why instead of leaving it unexplained.
                const supported = window.aampPlayer.supportedSpeeds;
                if (Array.isArray(supported) && supported.length > 0 && !supported.includes(rate)) {
                    const sortedSpeeds = [...supported].sort((a, b) => a - b);
                    const speedsText = sortedSpeeds.length > 1
                        ? sortedSpeeds.slice(0, -1).join(", ") + ", and " + sortedSpeeds[sortedSpeeds.length - 1]
                        : String(sortedSpeeds[0]);
                    logMsg("Requested rate '" + rate + "' is not supported by the content. Supported speeds are: " +
                        speedsText + ". AAMP may fall back to a playback rate of 1.");
                }
                // If AAMP is already at the requested rate (e.g. playnow(1) issued right after a
                // fastfwd that silently failed to change the rate), AAMP won't fire a ratechange
                // notification since there's no actual transition. Without an event,
                // updatePosValidationInfo() never runs and position capture is skipped for the
                // whole operation window, so start it proactively here instead.
                if (window.aampPlayer.lastSpeed === rate) {
                    updatePosValidationInfo(rate === 16 ? 10 : rate);
                }
                // Trying setPlaybackSpeed (org.rdk.player.setPlaybackSpeed) instead of setRate for
                // fast-forward/rewind: it sets the decoder speed directly, without going through
                // setRate's overshoot-correction / trick-mode-track selection path.
                window.aampPlayer.setPlaybackSpeed(rate).catch((e) => {
                    logMsg("[ERROR]: setPlaybackSpeed(" + rate + ") request failed: " + e);
                });
                return;
            }
            playbackRateIndex = playbackSpeeds.indexOf(rate);
            rate = playbackSpeeds[playbackRateIndex];
            expectedEvents = ["ratechange"];
            expectedRate = rate;
            observedRates = []
            logMsg("Expected Event: " + expectedEvents);
            logMsg("Expected Rate: " + rate);
            videoEl.playbackRate = rate;
        }

        function getRate() {
            if (isAAMP) return window.aampPlayer.getPlaybackRate();
            return videoEl.playbackRate;
        }

        /* volume */
        function setVolume(level) {
            if (isAAMP) {
                // AAMP volume range is 0-100; the shared operations pass a 0-1 level like HTML5.
                const aampVol = Math.round(level * 100);
                expectedVolume = aampVol;
                expectedMute = "";
                expectedEvents = ["volumechange"];
                volumeChangeFlag = 1;
                logMsg("Expected Event: volumechange set volume to " + aampVol);
                window.aampPlayer.setVolume(aampVol);
                observedEvents.push("volumechange");
                return;
            }
            if (isNaN(level) || level < 0 || level > 1) {
                logMsg("Invalid volume");
                return;
            }
            if (videoEl.muted) {
                videoEl.muted = false;
                logMsg("Video unmuted before setting volume");
            }
            // Only trigger event if value changes
            if (videoEl.volume !== level) {
                expectedVolume = level;
                expectedEvents = ["volumechange"];
                logMsg("Expected Event: " + expectedEvents + " set volume to " + level);
                videoEl.volume = level;
            } else {
                logMsg("Volume already at " + level + ", no change needed");
            }
        }

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }

        function normalizeTrackList(resp) {
            if (Array.isArray(resp)) return resp;
            if (typeof resp === "string") {
                try {
                    const parsed = JSON.parse(resp);
                    if (Array.isArray(parsed)) return parsed;
                    if (parsed && Array.isArray(parsed.tracks)) return parsed.tracks;
                } catch (e) { }
                return [];
            }
            if (resp && Array.isArray(resp.tracks)) return resp.tracks;
            return [];
        }

        async function changeAudio() {
            if (!isAAMP) { logMsg("changeaudio is AAMP-only operation"); return; }
            try {
                const tracks = normalizeTrackList(await window.aampPlayer.getAvailableAudioTracks(false));
                logMsg("Available Audio tracks: " + JSON.stringify(tracks));
                if (!tracks.length) {
                    audioTracksAvailability = 0;
                    logMsg("[ERROR]: Cannot perform Audio Track change operation");
                    return;
                }
                audioTracksAvailability = 1;
                const current = parseInt(await window.aampPlayer.getAudioTrack());
                if (isNaN(current) || current < 0 || current >= tracks.length) {
                    audioTracksAvailability = 0;
                    logMsg("[ERROR]: Audio language index obtained is invalid");
                    return;
                }
                const candidates = tracks
                    .map((t, i) => ({ track: t, index: i }))
                    .filter((t) => t.index !== current);
                if (!candidates.length) {
                    audioTracksAvailability = 0;
                    logMsg("[ERROR]: Audio tracks list excluding current language is empty");
                    return;
                }
                const selected = candidates[getRandomInt(candidates.length)];
                expectedAudioIndex = selected.index;
                logMsg("Changing audio language to: " + (selected.track.language || "unknown"));
                logMsg("Expected Audio Track index: " + expectedAudioIndex);
                audioChangeFlag = 1;
                await window.aampPlayer.setAudioTrack(expectedAudioIndex);
            } catch (e) {
                audioTracksAvailability = 0;
                logMsg("[ERROR]: changeaudio failed: " + e);
            }
        }

        /* ------------------------

           ------------------------ */

        videoEl.addEventListener('loadedmetadata', (e) => {

            }

            dispUIMessage(info);
            checkAndLogEvents("seeked", info);
            updatePosValidationInfo(1);
            if (expectedPos !== "") {
                const expTime = parseInt(expectedPos);
            }
